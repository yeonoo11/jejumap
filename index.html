<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광 안내 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #f6f8fa; color: #222; }
        header { padding: 14px 16px; background: #14213d; color: #fff; }
        header h1 { font-size: 20px; margin: 0 0 4px; }
        header p { margin: 0; font-size: 13px; opacity: .8; }
        .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
        button { padding: 10px 16px; font-size: 15px; border: 0; border-radius: 6px; background: #1e6fd9; color: #fff; cursor: pointer; }
        button:disabled { background: #999; }
        .ex { margin: 8px 0 16px; font-size: 13px; }
        .ex a { margin-right: 10px; color: #1e6fd9; cursor: pointer; }
        #judge { background: #ede7f6; border-left: 4px solid #7b2cbf; padding: 10px 12px; border-radius: 4px; margin-bottom: 12px; }
        #map { height: 360px; border-radius: 8px; margin-bottom: 12px; }
        .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
        .card b { font-size: 16px; }
        .tag { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; background: #e3f2fd; }
        .tag.out { background: #e8f5e9; }
        .tag.warn { background: #ffebee; color: #c62828; }
        .pin { background: #1e6fd9; color: #fff; border-radius: 50%; width: 26px; height: 26px; line-height: 26px; text-align: center; font-weight: 700; border: 2px solid #fff; }
        .pin.out { background: #2e9e5b; }
        details { margin-top: 12px; font-size: 13px; }
        pre { white-space: pre-wrap; word-break: break-all; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #e1e4e8; }
        small { color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>🏝️ 제주 관광 안내 에이전트</h1>
        <p>AI 가 날씨(Open-Meteo)와 관광지 목록을 스스로 찾아보고 추천해요</p>
    </header>
    <div class="wrap">
        <form id="form">
            <input id="q" maxlength="300" placeholder="예: 내일 동쪽에서 아이랑 갈 만한 곳 알려줘" required>
            <button id="go">추천받기</button>
        </form>
        <div class="ex">예시:
            <a>내일 동쪽에서 아이랑 반나절</a>
            <a>오늘 제주시 비 오면 갈 곳</a>
            <a>우도에서 3시간 놀기</a>
        </div>

        <div id="out" hidden>
            <div id="judge"></div>
            <div id="map"></div>
            <div id="cards"></div>
            <details><summary>🔍 생각 과정 보기</summary><div id="trace"></div></details>
            <small>핀은 지역 근처의 근사 위치입니다. 운영시간 · 요금은 확인하지 않았어요.</small>
        </div>
        <div id="msg"></div>
        <details id="raw" hidden><summary>📦 Gemini 서버가 준 원본 데이터 (JSON)</summary><div id="rawBody"></div></details>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const $ = (id) => document.getElementById(id)
        const map = L.map("map").setView([33.38, 126.55], 9)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "© OpenStreetMap contributors",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        document.querySelectorAll(".ex a").forEach((a) => (a.onclick = () => ($("q").value = a.textContent)))

        const el = (tag, text, cls) => {
            const e = document.createElement(tag)
            e.textContent = text
            if (cls) e.className = cls
            return e
        }

        $("form").addEventListener("submit", async (e) => {
            e.preventDefault()
            $("go").disabled = true
            $("msg").textContent = "도구를 골라 쓰는 중이에요... (10~20초)"
            $("out").hidden = true
            try {
                const res = await fetch("/api/agent", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ question: $("q").value }),
                })
                const text = await res.text()
                console.log("HTTP 상태:", res.status)
                let data
                try { data = JSON.parse(text) } catch (e) {
                    console.log("JSON 이 아닌 응답 (원문):", text)
                    throw new Error(`서버가 JSON 이 아닌 응답을 줬어요 (HTTP ${res.status}). 콘솔을 확인하세요.`)
                }
                // 내 서버(/api/agent)가 돌려준 전체 데이터
                console.log("서버 응답 전체:", data)
                // Gemini 서버가 준 원본 — 가공 없음. 객체를 펼쳐서 볼 수 있어요.
                ;(data.raw || []).forEach((r, i) => console.log(`Gemini 원본 #${i + 1} (HTTP ${r.status})`, r.response))
                showRaw(data.raw || [])
                if (data.error) throw new Error(data.error)
                render(data)
                $("msg").textContent = ""
            } catch (err) {
                $("msg").textContent = "추천을 만들지 못했어요: " + err.message
            }
            $("go").disabled = false
        })

        // Gemini 원본 응답을 화면에서도 열어 볼 수 있게 (성공 · 실패 모두)
        function showRaw(raw) {
            $("raw").hidden = !raw.length
            $("rawBody").replaceChildren()
            raw.forEach((r, i) => {
                $("rawBody").append(el("pre", `#${i + 1} · HTTP ${r.status} · ${r.model}\n` + JSON.stringify(r.response, null, 2)))
            })
        }

        function render(d) {
            $("out").hidden = false
            map.invalidateSize()
            $("judge").textContent = d.judge + (d.tip ? "  💡 " + d.tip : "")

            layer.clearLayers()
            $("cards").replaceChildren()
            const points = []
            d.places.forEach((p, i) => {
                const card = el("div", "", "card")
                const title = el("b", `${i + 1}. ${p.name}`)
                card.append(title)
                if (p.inList) {
                    card.append(el("span", p.indoor ? "실내" : "야외", "tag" + (p.indoor ? "" : " out")))
                    card.append(el("span", p.region, "tag"))
                } else {
                    card.append(el("span", "목록에 없음", "tag warn"))
                }
                card.append(el("div", p.why || ""))
                $("cards").append(card)

                if (p.inList) {
                    const icon = L.divIcon({ className: "", html: `<div class="pin ${p.indoor ? "" : "out"}">${i + 1}</div>`, iconSize: [26, 26] })
                    L.marker([p.lat, p.lng], { icon }).bindPopup(p.name).addTo(layer)
                    points.push([p.lat, p.lng])
                }
            })
            if (points.length) map.fitBounds(points, { padding: [30, 30], maxZoom: 11 })

            $("trace").replaceChildren()
            d.trace.forEach((t, i) => {
                $("trace").append(el("pre", `${i + 1}. ${t.tool}(${JSON.stringify(t.input)})\n→ ${JSON.stringify(t.output)}`))
            })
        }
    </script>
</body>
</html>
