<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 10px 16px; background: #14213d; color: #fff; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        header h1 { font-size: 18px; margin: 0; flex: 1 1 200px; }
        header select, header button { padding: 6px 8px; font-size: 14px; }
        #msg { padding: 6px 16px; background: #f1f3f5; font-size: 14px; }
        main { flex: 1; display: flex; min-height: 0; }
        #map { flex: 1; }
        aside { width: 280px; overflow-y: auto; padding: 8px 12px; border-left: 1px solid #ddd; font-size: 13px; }
        aside h2 { font-size: 15px; margin: 4px 0 8px; }
        aside li { margin-bottom: 8px; cursor: pointer; }
        aside li:hover { background: #fff3cd; }
        .legend { background: #fff; padding: 6px 10px; border-radius: 6px; line-height: 1.6; font-size: 12px; }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
        @media (max-width: 700px) { main { flex-direction: column; } aside { width: 100%; height: 35%; border-left: 0; border-top: 1px solid #ddd; } }
    </style>
</head>
<body>
    <header>
        <h1>🌍 지구 실시간 지진 지도</h1>
        <select id="period">
            <option value="hour">최근 1시간</option>
            <option value="day" selected>최근 24시간</option>
            <option value="week">최근 7일</option>
            <option value="month">최근 30일</option>
        </select>
        <select id="mag">
            <option value="all">모든 규모</option>
            <option value="2.5" selected>규모 2.5 이상</option>
            <option value="4.5">규모 4.5 이상</option>
            <option value="significant">주요 지진</option>
        </select>
        <button id="reload">새로고침</button>
    </header>
    <div id="msg">불러오는 중...</div>
    <main>
        <div id="map"></div>
        <aside>
            <h2>규모 큰 순 TOP 10</h2>
            <ol id="top"></ol>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map", { preferCanvas: true, worldCopyJump: true }).setView([20, 140], 2)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "© OpenStreetMap contributors · 지진 데이터 USGS",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        // 규모별 색상
        const color = (m) => m >= 6 ? "#7b2cbf" : m >= 4.5 ? "#d00000" : m >= 3 ? "#f77f00" : "#fcbf49"

        const legend = L.control({ position: "bottomleft" })
        legend.onAdd = () => {
            const d = L.DomUtil.create("div", "legend")
            d.innerHTML = [["#7b2cbf", "6.0 이상"], ["#d00000", "4.5 ~ 6.0"], ["#f77f00", "3.0 ~ 4.5"], ["#fcbf49", "3.0 미만"]]
                .map(([c, t]) => `<div><i style="background:${c}"></i>${t}</div>`).join("")
            return d
        }
        legend.addTo(map)

        const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
        const when = (t) => new Date(t).toLocaleString("ko-KR")

        async function load() {
            const msg = document.getElementById("msg")
            const top = document.getElementById("top")
            const url = `https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${document.getElementById("mag").value}_${document.getElementById("period").value}.geojson`
            msg.textContent = "불러오는 중..."
            try {
                const res = await fetch(url)
                if (!res.ok) throw new Error(res.status)
                const data = await res.json()
                layer.clearLayers()
                top.replaceChildren()

                const quakes = data.features.filter((f) => f.properties.mag !== null)
                quakes.forEach((f) => {
                    const [lng, lat, depth] = f.geometry.coordinates
                    const p = f.properties
                    L.circleMarker([lat, lng], {
                        radius: 3 + Math.max(p.mag, 0) ** 2 * 0.9,
                        color: color(p.mag), fillColor: color(p.mag), fillOpacity: 0.55, weight: 1,
                    }).bindPopup(
                        `<b>규모 ${p.mag}</b><br>${esc(p.place)}<br>깊이 ${depth} km<br>${when(p.time)}<br><a href="${esc(p.url)}" target="_blank" rel="noopener">USGS 상세</a>`
                    ).addTo(layer)
                })

                quakes.slice().sort((a, b) => b.properties.mag - a.properties.mag).slice(0, 10).forEach((f) => {
                    const li = document.createElement("li")
                    li.textContent = `M${f.properties.mag} · ${f.properties.place} · ${when(f.properties.time)}`
                    li.onclick = () => map.setView([f.geometry.coordinates[1], f.geometry.coordinates[0]], 6)
                    top.appendChild(li)
                })
                msg.textContent = `지진 ${quakes.length}건 · 마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")} (5분마다 자동 갱신)`
            } catch (e) {
                msg.textContent = "지진 데이터를 가져오지 못했어요. 잠시 후 다시 시도해 주세요."
            }
        }

        document.getElementById("period").onchange = load
        document.getElementById("mag").onchange = load
        document.getElementById("reload").onclick = load
        load()
        setInterval(load, 5 * 60 * 1000)
    </script>
</body>
</html>
